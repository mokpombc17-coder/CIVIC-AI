packages:
  - apps/*
  - packages/*

catalog:
  "@eslint/js": 9.39.5
  "@tailwindcss/postcss": 4.3.3
  "@types/node": ^24.0.0
  "@types/react": 19.2.17
  "@types/react-dom": ^19.2.0
  eslint: 9.39.5
  eslint-config-expo: 57.0.0
  eslint-config-next: 16.2.11
  eslint-config-prettier: 10.1.8
  expo: ~57.0.8
  expo-application: ~57.0.2
  expo-auth-session: ~57.0.5
  expo-constants: ~57.0.7
  expo-dev-client: ~57.0.9
  expo-file-system: ~57.0.1
  expo-linking: ~57.0.4
  expo-notifications: ~57.0.7
  expo-sharing: ~57.0.7
  expo-web-browser: ~57.0.2
  next: 16.2.11
  postcss: 8.5.26
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.0
  react-native-safe-area-context: ~5.7.0
  react-native-webview: 13.16.1
  tailwindcss: 4.3.3
  typescript: 6.0.3
  typescript-eslint: 8.64.0
  vitest: ^4.1.10
  zod: ^4.0.0

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": false
  esbuild: true
  sharp: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - expo-dev-client@57.0.8 || 57.0.9
  - expo-dev-launcher@57.0.8 || 57.0.9
  - expo-dev-menu@57.0.8 || 57.0.9
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - uuid@11.1.1
  - sharp@0.35.0
  - brace-expansion@1.1.17 || 1.1.18 || 5.0.8 || 5.0.9
  - js-yaml@4.3.1
  - nanoid@3.3.17
  - "@axe-core/playwright@4.13.0"

overrides:
  nanoid@<3.3.17: ^3.3.17
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  sharp@<0.35.0: ^0.35.0
  uuid@<11.1.1: ^11.1.1
