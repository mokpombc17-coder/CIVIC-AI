map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream next_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream chat_websocket {
  server 127.0.0.1:8082;
  keepalive 16;
}

server {
  listen 443 ssl http2;
  server_name app.example.com;

  # ssl_certificate and ssl_certificate_key are managed by your TLS setup.

  client_max_body_size 10m;

  location /ws/chat/ {
    proxy_pass http://chat_websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
  }

  location / {
    proxy_pass http://next_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js streaming/RSC responses should not be buffered indiscriminately.
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}
