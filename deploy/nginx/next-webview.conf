upstream next_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

upstream rag_resource {
  server 127.0.0.1:8000;
  keepalive 16;
}

upstream simulation_resource {
  server 127.0.0.1:8090;
  keepalive 16;
}

map $request_uri $rag_resource_request_uri {
  default "";
  ~^/api/v1/rag/(?<rag_resource_suffix>.*)$ /internal/v1/rag/$rag_resource_suffix;
}

map $request_uri $rag_frame_options {
  default "";
  ~^/api/v1/rag/sources(?:/|\?|$) SAMEORIGIN;
  ~^/api/v1/rag/documents/[^/?]+/versions/[^/?]+/preview(?:\?|$) SAMEORIGIN;
  ~^/api/v1/rag/ DENY;
}

map $request_uri $rag_frame_ancestors {
  default "";
  ~^/api/v1/rag/sources(?:/|\?|$) "frame-ancestors 'self'";
  ~^/api/v1/rag/documents/[^/?]+/versions/[^/?]+/preview(?:\?|$) "frame-ancestors 'self'";
  ~^/api/v1/rag/ "frame-ancestors 'none'";
}

server {
  listen 443 ssl http2;
  server_name app.example.com;

  # ssl_certificate and ssl_certificate_key are managed by your TLS setup.
  #
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options $rag_frame_options always;
  add_header Content-Security-Policy $rag_frame_ancestors always;

  client_max_body_size 10m;

  location ~ "^/stream/rag/queries/([0-9a-fA-F-]{36})$" {
    proxy_pass http://rag_resource;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Last-Event-ID $http_last_event_id;
    rewrite "^/stream/rag/queries/([0-9a-fA-F-]{36})$" /internal/v1/rag/queries/$1/events break;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 25m;
    proxy_send_timeout 25m;
  }

  location /stream/rag/queries/ {
    return 404;
  }

  location = /api/v1/rag {
    return 404;
  }

  location ^~ /api/v1/rag/ {
    # Files up to 500 MiB are split into 8 MiB multipart requests by the UI.
    # Keep the edge bound per request so a direct Resource Server route cannot
    # be used to stream one unbounded body into application memory.
    client_max_body_size 12m;
    proxy_request_buffering off;
    proxy_pass http://rag_resource$rag_resource_request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Range $http_range;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
  }

  location ~ "^/api/v1/admin/tasks/[0-9a-fA-F-]{36}/simulations(?:/preview)?$" {
    client_max_body_size 12m;
    proxy_pass http://simulation_resource;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
  }

  location ~ ^/api/v1/admin/(simulations(?:/.*)?|simulation-options|simulation-capacity|simulation-tasks(?:/.*)?|simulation-scenarios(?:/.*)?|simulation-billing(?:/.*)?)$ {
    client_max_body_size 12m;
    proxy_pass http://simulation_resource;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
  }

  location / {
    proxy_pass http://next_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js streaming/RSC responses should not be buffered indiscriminately.
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}
