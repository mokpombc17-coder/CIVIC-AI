services:
  mongodb:
    image: mongo:7.0.14
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "
          try {
            const status = rs.status();
            quit(status.myState === 1 ? 0 : 1);
          } catch (error) {
            if (error.code === 94
                || error.codeName === 'NotYetInitialized') {
              try {
                rs.initiate({
                  _id: 'rs0',
                  members: [{ _id: 0, host: 'localhost:27017' }]
                });
              } catch (ignored) {
              }
            }
            quit(1);
          }"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  mongodb-data:
