spring:
  mongodb:
    uri: ${CHAT_MONGODB_URI}

civic:
  auth:
    issuer: ${CHAT_JWT_ISSUER_URI}
    jwks-uri: ${CHAT_JWT_JWKS_URI}
    browser-origin: ${CHAT_BROWSER_ORIGIN}

chat:
  room:
    creation:
      mode: APPROVAL_REQUIRED

  websocket:
    allowed-origins: ${CHAT_WEBSOCKET_ALLOWED_ORIGINS}
  security:
    cookie-authentication-enabled: ${CHAT_SECURITY_COOKIE_AUTHENTICATION_ENABLED:true}
