spring:
  config:
    import: ${SPRING_CONFIG_IMPORT:configtree:/run/secrets/civic/main/}
  datasource:
    url: ${CIVIC_DB_URL}
    username: ${CIVIC_DB_USER}
  data:
    redis:
      url: ${CIVIC_REDIS_URL}
  mail:
    host: ${CIVIC_SMTP_HOST}
    port: ${CIVIC_SMTP_PORT:587}

civic:
  issuer: ${CIVIC_ISSUER}
  es256:
    key-directory: ${CIVIC_ES256_KEY_DIRECTORY:/run/secrets/civic/main/es256-keys}
