spring:
  mongodb:
    uri: ${CHAT_MONGODB_URI}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CHAT_JWT_ISSUER_URI}
          audiences:
            - ${CHAT_JWT_AUDIENCE:civic-ai-api}

chat:
  websocket:
    allowed-origins: ${CHAT_WEBSOCKET_ALLOWED_ORIGINS}
  security:
    cookie-authentication-enabled: ${CHAT_SECURITY_COOKIE_AUTHENTICATION_ENABLED:true}
