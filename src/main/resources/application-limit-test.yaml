chat:
  message-pipeline:
    mode: ${CHAT_MESSAGE_PIPELINE_MODE:recording}
    queue-capacity: ${CHAT_MESSAGE_PIPELINE_QUEUE_CAPACITY:100}
    shutdown-drain-timeout-ms: ${CHAT_MESSAGE_PIPELINE_SHUTDOWN_DRAIN_TIMEOUT_MS:10000}

  websocket:
    limit-test:
      allowed-rooms:
        - test-room

    temporary-jwt:
      secret: ${CHAT_LOCAL_JWT_SECRET:chat-limit-test-only-secret-key-32b}
      issuer: ${CHAT_LOCAL_JWT_ISSUER:chat-local}
      audience: ${CHAT_LOCAL_JWT_AUDIENCE:chat-server}
