spring:
  application:
    name: chat-server
  lifecycle:
    timeout-per-shutdown-phase: 30s

chat:
  room:
    command:
      receipt-ttl: 1h
      max-attempts: 3
      retry-backoff: 10ms
    membership:
      max-active-members-per-room: ${CHAT_ROOM_MAX_ACTIVE_MEMBERS_PER_ROOM:50}
      max-active-rooms-per-user: ${CHAT_ROOM_MAX_ACTIVE_ROOMS_PER_USER:20}
      active-room-count-query-max-time: ${CHAT_ROOM_ACTIVE_ROOM_COUNT_QUERY_MAX_TIME:1s}
    authorization:
      max-consistency-attempts: 3

  room-query:
    listed-room-page-query-max-time: ${CHAT_LISTED_ROOM_PAGE_QUERY_MAX_TIME:1s}

  message-pipeline:
    queue-capacity: ${CHAT_MESSAGE_PIPELINE_QUEUE_CAPACITY:100}
    shutdown-drain-timeout-ms: ${CHAT_MESSAGE_PIPELINE_SHUTDOWN_DRAIN_TIMEOUT_MS:10000}

  outbox:
    poll-interval-ms: ${CHAT_OUTBOX_POLL_INTERVAL_MS:100}
    claim-timeout-ms: ${CHAT_OUTBOX_CLAIM_TIMEOUT_MS:30000}
    batch-size: ${CHAT_OUTBOX_BATCH_SIZE:100}
    shutdown-drain-timeout-ms: ${CHAT_OUTBOX_SHUTDOWN_DRAIN_TIMEOUT_MS:10000}
    metrics-sample-interval-ms: ${CHAT_OUTBOX_METRICS_SAMPLE_INTERVAL_MS:10000}
    retry:
      initial-backoff-ms: ${CHAT_OUTBOX_RETRY_INITIAL_BACKOFF_MS:250}
      max-backoff-ms: ${CHAT_OUTBOX_RETRY_MAX_BACKOFF_MS:30000}

  room-inbox:
    unread-count-cap: ${CHAT_ROOM_INBOX_UNREAD_COUNT_CAP:200}
    count-query-max-time: ${CHAT_ROOM_INBOX_COUNT_QUERY_MAX_TIME:1s}
    page-query-max-time: ${CHAT_ROOM_INBOX_PAGE_QUERY_MAX_TIME:1s}
    notification:
      queue-capacity: ${CHAT_ROOM_INBOX_NOTIFICATION_QUEUE_CAPACITY:1000}
      coalescing-window-ms: ${CHAT_ROOM_INBOX_COALESCING_WINDOW_MS:100}
      max-events-per-room-batch: ${CHAT_ROOM_INBOX_MAX_EVENTS_PER_BATCH:100}
      max-recipient-snapshot-size: ${CHAT_ROOM_INBOX_MAX_RECIPIENT_SNAPSHOT_SIZE:100}
      shutdown-drain-timeout-ms: ${CHAT_ROOM_INBOX_NOTIFICATION_DRAIN_TIMEOUT_MS:1000}

  websocket:
    endpoint: /ws

    connection:
      max-active-authenticated: 500
      max-per-user: 1
      replace-existing-connection: true

    heartbeat:
      interval-ms: 10000
      client-outgoing-min-ms: 1
      client-outgoing-max-ms: 10000
      client-incoming-min-ms: 1
      client-incoming-max-ms: 10000

    subscription:
      max-active-rooms-per-connection: 1
      max-subscriptions-per-connection: 6
      max-subscribers-per-room: 50
      reject-duplicate-destination: true
      allow-wildcard-destination: false
      read-receipts-enabled: false

    rate-limit:
      user:
        capacity: 5
        refill-tokens: 1
        refill-period-ms: 1000
        token-cost-tiers:
          - { max-code-points: 50, cost: 1 }
          - { max-code-points: 100, cost: 2 }
          - { max-code-points: 200, cost: 3 }
          - { max-code-points: 500, cost: 4 }
          - { max-code-points: 2000, cost: 5 }

      global-source:
        sustained-window-ms: 10000
        sustained-max-accepted: 500
        burst-window-ms: 1000
        burst-max-accepted: 100

    message:
      room-id-regex: "^[A-Za-z0-9_-]{1,64}$"
      max-content-code-points: 2000
      max-content-utf8-bytes: 8192
      max-stomp-message-bytes: 32768
      normalize-content-with-strip: true
      reject-c0-control-characters-except: [TAB, LF, CR]

    transport:
      time-to-first-message-ms: 10000
      send-buffer-size-limit-per-connection-bytes: 262144
      send-time-limit-per-connection-ms: 10000

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - chatPipeline
            - chatOutbox
            - mongodb
