spring:
  application:
    name: civic-main-auth
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${CIVIC_DB_URL:jdbc:postgresql://localhost:5432/civic_main}
    username: ${CIVIC_DB_USER:civic_main}
    password: ${CIVIC_DB_PASSWORD:local-development-only}
  flyway:
    placeholders:
      bootstrap_admin_email: ${CIVIC_BOOTSTRAP_ADMIN_EMAIL:admin@civic.local}
      bootstrap_admin_password_hash: ${CIVIC_BOOTSTRAP_ADMIN_PASSWORD_HASH:$argon2id$v=19$m=65536,t=3,p=1$Y2l2aWM$Y2l2aWM}
  data:
    redis:
      url: ${CIVIC_REDIS_URL:redis://localhost:6379}
  mail:
    host: ${CIVIC_SMTP_HOST:localhost}
    port: ${CIVIC_SMTP_PORT:1025}
civic:
  runtime:
    # CIVIC_RUNTIME_MODE must be exactly server or worker.
    mode: ${CIVIC_RUNTIME_MODE:server}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: db,redis,ping
  endpoints.web.path-mapping:
    health: health
