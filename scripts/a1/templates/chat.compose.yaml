services:
  mongodb:
    image: mongo:7.0.14@sha256:0032d2ca20db5fa34926f196c8a43b74e34ed239a7f2453ff1505b6f12ba8ea6
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    restart: unless-stopped
    volumes:
      - chat-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { const expected = 'mongodb:27017';
          const c = rs.conf(); if (c.members.length !== 1 ||
          c.members[0].host !== expected) {
          c.members = [{ _id: 0, host: expected }]; rs.reconfig(c, { force:
          true }); quit(1); }
          quit(rs.status().myState === 1 ? 0 : 1); } catch (e) {
          if (e.code === 94 || e.codeName === 'NotYetInitialized') {
          try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host:
          'mongodb:27017' }] }); }
          catch (ignored) {} } quit(1); }"
      interval: 60s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 30s

  chat-resource-server:
    image: ${CHAT_IMAGE:?CHAT_IMAGE is required}
    pull_policy: never
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    init: true
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,stage,auth-main
      SERVER_PORT: "8083"
      CHAT_MONGODB_URI: mongodb://mongodb:27017/chat_local?replicaSet=rs0&retryWrites=true&w=majority
      CHAT_JWT_ISSUER_URI: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      CHAT_JWT_JWKS_URI: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}/.well-known/jwks.json
      CHAT_BROWSER_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      CHAT_WEBSOCKET_ALLOWED_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      CHAT_SECURITY_COOKIE_AUTHENTICATION_ENABLED: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8083/actuator/health
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 35s

volumes:
  chat-data:
    external: true
    name: ${CHAT_DATA_VOLUME:?CHAT_DATA_VOLUME is required}
