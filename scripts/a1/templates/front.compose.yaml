services:
  front:
    image: ${FRONT_IMAGE:?FRONT_IMAGE is required}
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001/chat', {redirect: 'manual'})
          .then((response) => process.exit(response.status >= 200 && response.status < 500 ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  default:
    name: ${FRONT_EDGE_NETWORK:-civic-a1-dev_default}
    external: true
