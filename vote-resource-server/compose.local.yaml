services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: vote
      POSTGRES_USER: vote
      POSTGRES_PASSWORD: vote
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  vote-resource-server:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8083
      VOTE_DB_URL: jdbc:postgresql://postgres:5432/vote
      VOTE_DB_USERNAME: vote
      VOTE_DB_PASSWORD: vote
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"

volumes:
  postgres-data:
