services:
  vote-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: vote
      POSTGRES_USER: vote
      POSTGRES_PASSWORD: vote
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  vote-resource-server:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: local,stage,auth-main
      SERVER_PORT: 8082
      VOTE_DB_URL: jdbc:postgresql://vote-db:5432/vote
      VOTE_DB_USERNAME: vote
      VOTE_DB_PASSWORD: vote
      VOTE_TASK_BOOTSTRAP_PARTICIPATION_ENABLED: ${VOTE_TASK_BOOTSTRAP_PARTICIPATION_ENABLED:-true}
      VOTE_TASK_BOOTSTRAP_SUBMISSION_SIMULATION_ENABLED: ${VOTE_TASK_BOOTSTRAP_SUBMISSION_SIMULATION_ENABLED:-true}
      VOTE_JWT_ISSUER_URI: ${VOTE_JWT_ISSUER_URI:-https://140-238-17-223.sslip.io}
      VOTE_JWT_JWKS_URI: ${VOTE_JWT_JWKS_URI:-https://140-238-17-223.sslip.io/.well-known/jwks.json}
      VOTE_BROWSER_ORIGIN: ${VOTE_BROWSER_ORIGIN:-https://140-238-17-223.sslip.io}
      VOTE_SECURITY_LOCAL_ADMIN_API_ENABLED: ${VOTE_SECURITY_LOCAL_ADMIN_API_ENABLED:-false}
    depends_on:
      vote-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://localhost:8082/actuator/health
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

volumes:
  postgres-data:
