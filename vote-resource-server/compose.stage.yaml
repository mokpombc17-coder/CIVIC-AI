services:
  vote-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: vote
      POSTGRES_USER: vote
      POSTGRES_PASSWORD: vote
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  vote-resource-server:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: local,stage,auth-main
      SERVER_PORT: 8082
      VOTE_DB_URL: jdbc:postgresql://vote-db:5432/vote
      VOTE_DB_USERNAME: vote
      VOTE_DB_PASSWORD: vote
      VOTE_TASK_BOOTSTRAP_PERSONA_SUBJECTS: >-
        ${VOTE_TASK_BOOTSTRAP_PERSONA_SUBJECTS:-
        46fd4756-f07f-4b54-b03a-6e07740317da,
        4af25cff-f0ad-4a43-ad4f-5f556dcdff5b,
        89074124-2d0f-4cc1-b14e-8e8a3c5e933f,
        7f099599-04a3-4d25-9798-15a491e1ff32,
        77b1499c-6951-4242-8ce8-d8a5b9d31621,
        69230d56-11b5-42dd-9eea-a8116c005fc5,
        352e7eab-ed90-4c7f-8628-483c4a5404aa,
        cbf68442-aa94-4502-9911-9e1e348214b8,
        74d8b3c6-86ed-44bd-abf6-8af36f21d753,
        8c90ae1f-5b2d-435a-91fa-074ebe3e1d7c,
        3c19157f-da2a-4392-8652-8643a5e2f019}
      VOTE_TASK_BOOTSTRAP_PARTICIPATION_ENABLED: ${VOTE_TASK_BOOTSTRAP_PARTICIPATION_ENABLED:-false}
      VOTE_TASK_BOOTSTRAP_SUBMISSION_SIMULATION_ENABLED: ${VOTE_TASK_BOOTSTRAP_SUBMISSION_SIMULATION_ENABLED:-false}
      VOTE_SURVEY_PREVIEW_USER_IDS: >-
        ${VOTE_SURVEY_PREVIEW_USER_IDS:-
        352e7eab-ed90-4c7f-8628-483c4a5404aa,
        cbf68442-aa94-4502-9911-9e1e348214b8,
        74d8b3c6-86ed-44bd-abf6-8af36f21d753}
      VOTE_JWT_ISSUER_URI: ${VOTE_JWT_ISSUER_URI:-https://140-238-17-223.sslip.io}
      VOTE_JWT_JWKS_URI: ${VOTE_JWT_JWKS_URI:-https://140-238-17-223.sslip.io/.well-known/jwks.json}
      VOTE_BROWSER_ORIGIN: ${VOTE_BROWSER_ORIGIN:-https://140-238-17-223.sslip.io}
      VOTE_SECURITY_LOCAL_ADMIN_API_ENABLED: ${VOTE_SECURITY_LOCAL_ADMIN_API_ENABLED:-false}
    depends_on:
      vote-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://localhost:8082/actuator/health
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

volumes:
  postgres-data:
