services:
  vote-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: vote
      POSTGRES_USER: vote
      POSTGRES_PASSWORD: vote
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  vote-resource-server:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: stage,auth-main
      SERVER_PORT: 8082
      VOTE_DB_URL: jdbc:postgresql://vote-db:5432/vote
      VOTE_DB_USERNAME: vote
      VOTE_DB_PASSWORD: vote
      VOTE_INTEGRATION_OUTBOX_DISPATCHER_ENABLED: ${VOTE_INTEGRATION_OUTBOX_DISPATCHER_ENABLED:-true}
      VOTE_AI_RUNTIME_AUTH_TOKEN: ${VOTE_AI_RUNTIME_AUTH_TOKEN:-cc01df0e6bffc84dfd6af21f57a775f890c60b3d243f7a5d82aec98fe8f71d3e}
      VOTE_PERSONA_ENABLED: ${VOTE_PERSONA_ENABLED:-true}
      VOTE_PERSONA_PROVIDER: ${VOTE_PERSONA_PROVIDER:-http}
      VOTE_PERSONA_BASE_URL: ${VOTE_AI_RUNTIME_BASE_URL:-https://civic-ai.co.kr}
      VOTE_TASK_LIFECYCLE_ENABLED: ${VOTE_TASK_LIFECYCLE_ENABLED:-true}
      VOTE_TASK_PREPARATION_ENABLED: ${VOTE_TASK_PREPARATION_ENABLED:-true}
      VOTE_TASK_PREPARATION_PROVIDER: ${VOTE_TASK_PREPARATION_PROVIDER:-http}
      VOTE_TASK_PREPARATION_BASE_URL: ${VOTE_AI_RUNTIME_BASE_URL:-https://civic-ai.co.kr}
      VOTE_TASK_PREDICTION_ENABLED: ${VOTE_TASK_PREDICTION_ENABLED:-true}
      VOTE_TASK_PREDICTION_PROVIDER: ${VOTE_TASK_PREDICTION_PROVIDER:-http}
      VOTE_TASK_PREDICTION_BASE_URL: ${VOTE_AI_RUNTIME_BASE_URL:-https://civic-ai.co.kr}
      VOTE_TASK_OPINION_MAP_ENABLED: ${VOTE_TASK_OPINION_MAP_ENABLED:-false}
      VOTE_TASK_OPINION_MAP_PROVIDER: ${VOTE_TASK_OPINION_MAP_PROVIDER:-openrouter}
      VOTE_TASK_OPINION_MAP_MODEL: ${VOTE_TASK_OPINION_MAP_MODEL:-openai/gpt-5.6-luna}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VOTE_SURVEY_ROUND_ACTIVATION_ENABLED: ${VOTE_SURVEY_ROUND_ACTIVATION_ENABLED:-true}
      VOTE_JWT_ISSUER_URI: ${VOTE_JWT_ISSUER_URI:-https://140-238-17-223.sslip.io}
      VOTE_JWT_JWKS_URI: ${VOTE_JWT_JWKS_URI:-https://140-238-17-223.sslip.io/.well-known/jwks.json}
      VOTE_BROWSER_ORIGIN: ${VOTE_BROWSER_ORIGIN:-https://140-238-17-223.sslip.io}
      VOTE_SECURITY_LOCAL_ADMIN_API_ENABLED: ${VOTE_SECURITY_LOCAL_ADMIN_API_ENABLED:-false}
    depends_on:
      vote-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://localhost:8082/actuator/health
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

volumes:
  postgres-data:
