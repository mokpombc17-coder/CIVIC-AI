spring:
  datasource:
    url: ${VOTE_DB_URL}
    username: ${VOTE_DB_USERNAME}
    password: ${VOTE_DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${VOTE_JWT_ISSUER_URI}
          audiences:
            - ${VOTE_JWT_AUDIENCE}

vote:
  integration:
    outbox:
      enabled: ${VOTE_INTEGRATION_OUTBOX_ENABLED:true}
  persona:
    enabled: ${VOTE_PERSONA_ENABLED:${VOTE_SURVEY_PERSONA_ENABLED:true}}
    provider: ${VOTE_PERSONA_PROVIDER:${VOTE_SURVEY_PERSONA_PROVIDER:http}}
    base-url: ${VOTE_PERSONA_BASE_URL:${VOTE_SURVEY_PERSONA_BASE_URL:}}
    auth-token: ${VOTE_PERSONA_AUTH_TOKEN:${VOTE_SURVEY_PERSONA_AUTH_TOKEN:}}
    connect-timeout: ${VOTE_PERSONA_CONNECT_TIMEOUT:5s}
    request-timeout: ${VOTE_PERSONA_REQUEST_TIMEOUT:60s}
    dispatcher-delay: ${VOTE_PERSONA_DISPATCHER_DELAY:${VOTE_SURVEY_PERSONA_DISPATCHER_DELAY:5s}}
    processing-lease-duration: ${VOTE_PERSONA_PROCESSING_LEASE_DURATION:90s}
    lease-reaper-delay: ${VOTE_PERSONA_LEASE_REAPER_DELAY:10s}
    retry-initial-delay: ${VOTE_PERSONA_RETRY_INITIAL_DELAY:30s}
    retry-max-delay: ${VOTE_PERSONA_RETRY_MAX_DELAY:2m}
    max-attempts: ${VOTE_PERSONA_MAX_ATTEMPTS:3}
    batch-size: ${VOTE_PERSONA_BATCH_SIZE:10}
    worker-pool-size: ${VOTE_PERSONA_WORKER_POOL_SIZE:4}
    worker-queue-capacity: ${VOTE_PERSONA_WORKER_QUEUE_CAPACITY:20}
    worker-shutdown-await: ${VOTE_PERSONA_WORKER_SHUTDOWN_AWAIT:30s}
  task:
    lifecycle:
      enabled: ${VOTE_TASK_LIFECYCLE_ENABLED:true}
    prediction:
      enabled: ${VOTE_TASK_PREDICTION_ENABLED:false}
      provider: ${VOTE_TASK_PREDICTION_PROVIDER:http}
      base-url: ${VOTE_TASK_PREDICTION_BASE_URL:}
      path: ${VOTE_TASK_PREDICTION_PATH:/v1/task-predictions}
      auth-token: ${VOTE_TASK_PREDICTION_AUTH_TOKEN:}
      connect-timeout: ${VOTE_TASK_PREDICTION_CONNECT_TIMEOUT:5s}
      request-timeout: ${VOTE_TASK_PREDICTION_REQUEST_TIMEOUT:60s}
      candidate-policy-version: ${VOTE_TASK_PREDICTION_CANDIDATE_POLICY_VERSION:candidate-policy-v1}
      maximum-attempts: ${VOTE_TASK_PREDICTION_MAXIMUM_ATTEMPTS:2}
      retry-delay: ${VOTE_TASK_PREDICTION_RETRY_DELAY:30s}
      dispatcher-delay: ${VOTE_TASK_PREDICTION_DISPATCHER_DELAY:5s}
      processing-lease-duration: ${VOTE_TASK_PREDICTION_PROCESSING_LEASE_DURATION:90s}
      lease-reaper-delay: ${VOTE_TASK_PREDICTION_LEASE_REAPER_DELAY:10s}
      batch-size: ${VOTE_TASK_PREDICTION_BATCH_SIZE:10}
      worker-pool-size: ${VOTE_TASK_PREDICTION_WORKER_POOL_SIZE:4}
      worker-queue-capacity: ${VOTE_TASK_PREDICTION_WORKER_QUEUE_CAPACITY:16}
      worker-shutdown-await: ${VOTE_TASK_PREDICTION_WORKER_SHUTDOWN_AWAIT:10s}
  survey:
    round-activation:
      enabled: ${VOTE_SURVEY_ROUND_ACTIVATION_ENABLED:true}
      fixed-delay: ${VOTE_SURVEY_ROUND_ACTIVATION_FIXED_DELAY:5s}
      initial-delay: ${VOTE_SURVEY_ROUND_ACTIVATION_INITIAL_DELAY:0s}
  security:
    cookie-authentication-enabled: false
