spring:
  application:
    name: vote-resource-server
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

vote:
  integration:
    outbox:
      enabled: false
      poller-delay: 1s
      retry-initial-delay: 5s
      retry-max-delay: 5m
      max-attempts: 10
      batch-size: 20
  security:
    local-admin-api-enabled: false
  persona:
    enabled: ${vote.survey.persona.enabled:false}
    provider: ${vote.survey.persona.provider:http}
    base-url: ${vote.survey.persona.base-url:http://localhost:8090}
    auth-token: ${vote.survey.persona.auth-token:}
    connect-timeout: ${vote.survey.persona.connect-timeout:5s}
    request-timeout: ${vote.survey.persona.request-timeout:60s}
    dispatcher-delay: ${vote.survey.persona.dispatcher-delay:5s}
    retry-initial-delay: ${vote.survey.persona.retry-initial-delay:30s}
    retry-max-delay: ${vote.survey.persona.retry-max-delay:2m}
    max-attempts: ${vote.survey.persona.max-attempts:3}
    batch-size: ${vote.survey.persona.batch-size:10}
  task:
    bootstrap:
      enabled: false
    lifecycle:
      enabled: false
      scheduler-delay: 1s
      batch-size: 100
    prediction:
      enabled: false
      provider: http
      base-url: http://localhost:8090
      path: /v1/task-predictions
      connect-timeout: 5s
      candidate-policy-version: candidate-policy-v1
      requested-candidate-count: 2
      request-timeout: 60s
      maximum-attempts: 2
      retry-delay: 30s
      dispatcher-delay: 5s
      batch-size: 10
      fake:
        scenario: success
  survey:
    bootstrap:
      enabled: false
