spring:
  application:
    name: vote-resource-server
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

vote:
  integration:
    outbox:
      enabled: false
      poller-delay: 1s
      retry-initial-delay: 5s
      retry-max-delay: 5m
      max-attempts: 10
      batch-size: 20
  security:
    local-admin-api-enabled: false
  task:
    bootstrap:
      enabled: false
    lifecycle:
      enabled: false
      scheduler-delay: 1s
      batch-size: 100
    prediction:
      enabled: false
      provider: http
      base-url: http://localhost:8090
      path: /v1/task-predictions
      connect-timeout: 5s
      candidate-policy-version: candidate-policy-v1
      requested-candidate-count: 2
      request-timeout: 60s
      maximum-attempts: 2
      retry-delay: 30s
      dispatcher-delay: 5s
      batch-size: 10
      fake:
        scenario: success
  survey:
    bootstrap:
      enabled: false
    persona:
      enabled: false
      provider: http
      base-url: http://localhost:8090
      connect-timeout: 5s
      request-timeout: 60s
      dispatcher-delay: 5s
      retry-initial-delay: 30s
      retry-max-delay: 2m
      max-attempts: 3
      batch-size: 10
