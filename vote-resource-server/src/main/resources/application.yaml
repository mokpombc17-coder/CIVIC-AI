spring:
  application:
    name: vote-resource-server
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

vote:
  security:
    local-admin-api-enabled: false
  survey:
    bootstrap:
      enabled: false
    persona:
      enabled: false
      base-url: http://localhost:8090
      connect-timeout: 5s
      request-timeout: 60s
      dispatcher-delay: 5s
      retry-initial-delay: 30s
      retry-max-delay: 2m
      max-attempts: 3
      batch-size: 10
