spring:
  datasource:
    url: ${VOTE_DB_URL:jdbc:postgresql://localhost:5432/vote}
    username: ${VOTE_DB_USERNAME:vote}
    password: ${VOTE_DB_PASSWORD:vote}

vote:
  integration:
    outbox:
      dispatcher-enabled: ${VOTE_INTEGRATION_OUTBOX_DISPATCHER_ENABLED:${VOTE_INTEGRATION_OUTBOX_ENABLED:true}}
  persona:
    enabled: ${VOTE_PERSONA_ENABLED:${VOTE_SURVEY_PERSONA_ENABLED:true}}
    provider: ${VOTE_PERSONA_PROVIDER:${VOTE_SURVEY_PERSONA_PROVIDER:fake}}
    base-url: ${VOTE_PERSONA_BASE_URL:${VOTE_SURVEY_PERSONA_BASE_URL:http://localhost:8090}}
    auth-token: ${VOTE_PERSONA_AUTH_TOKEN:${VOTE_SURVEY_PERSONA_AUTH_TOKEN:}}
    dispatcher-delay: ${VOTE_PERSONA_DISPATCHER_DELAY:${VOTE_SURVEY_PERSONA_DISPATCHER_DELAY:500ms}}
    processing-lease-duration: ${VOTE_PERSONA_PROCESSING_LEASE_DURATION:90s}
    lease-reaper-delay: ${VOTE_PERSONA_LEASE_REAPER_DELAY:5s}
    worker-pool-size: ${VOTE_PERSONA_WORKER_POOL_SIZE:2}
    worker-queue-capacity: ${VOTE_PERSONA_WORKER_QUEUE_CAPACITY:10}
    worker-shutdown-await: ${VOTE_PERSONA_WORKER_SHUTDOWN_AWAIT:10s}
  task:
    bootstrap:
      enabled: ${VOTE_TASK_BOOTSTRAP_ENABLED:true}
      persona-ready-enabled: ${VOTE_TASK_BOOTSTRAP_PERSONA_READY_ENABLED:true}
      participation-enabled: ${VOTE_TASK_BOOTSTRAP_PARTICIPATION_ENABLED:true}
      submission-simulation-enabled: ${VOTE_TASK_BOOTSTRAP_SUBMISSION_SIMULATION_ENABLED:true}
      persona-subject: ${VOTE_TASK_BOOTSTRAP_PERSONA_SUBJECT:local-user-1}
      persona-ready-timeout: ${VOTE_TASK_BOOTSTRAP_PERSONA_READY_TIMEOUT:10s}
      persona-ready-poll-interval: ${VOTE_TASK_BOOTSTRAP_PERSONA_READY_POLL_INTERVAL:100ms}
    lifecycle:
      enabled: ${VOTE_TASK_LIFECYCLE_ENABLED:true}
    prediction:
      enabled: ${VOTE_TASK_PREDICTION_ENABLED:true}
      provider: ${VOTE_TASK_PREDICTION_PROVIDER:fake}
      base-url: ${VOTE_TASK_PREDICTION_BASE_URL:http://localhost:8090}
      path: ${VOTE_TASK_PREDICTION_PATH:/v1/task-predictions}
      auth-token: ${VOTE_TASK_PREDICTION_AUTH_TOKEN:}
      connect-timeout: ${VOTE_TASK_PREDICTION_CONNECT_TIMEOUT:5s}
      request-timeout: ${VOTE_TASK_PREDICTION_REQUEST_TIMEOUT:60s}
      retry-delay: ${VOTE_TASK_PREDICTION_RETRY_DELAY:1s}
      dispatcher-delay: ${VOTE_TASK_PREDICTION_DISPATCHER_DELAY:500ms}
      fake:
        scenario: ${VOTE_TASK_PREDICTION_FAKE_SCENARIO:success}
  survey:
    round-activation:
      enabled: ${VOTE_SURVEY_ROUND_ACTIVATION_ENABLED:true}
      fixed-delay: ${VOTE_SURVEY_ROUND_ACTIVATION_FIXED_DELAY:5s}
      initial-delay: ${VOTE_SURVEY_ROUND_ACTIVATION_INITIAL_DELAY:0s}
    bootstrap:
      enabled: ${VOTE_SURVEY_BOOTSTRAP_ENABLED:true}
  security:
    local-admin-api-enabled: true
    cookie-authentication-enabled: true
    local-jwt:
      secret: ${VOTE_LOCAL_JWT_SECRET:civic-ai-local-auth-fixture-signing-key-v1-public-do-not-use-in-production}
      issuer: ${VOTE_LOCAL_JWT_ISSUER:http://localhost:3000/api/dev/auth}
      audience: ${VOTE_LOCAL_JWT_AUDIENCE:civic-ai-api}
