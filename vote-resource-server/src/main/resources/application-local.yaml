spring:
  datasource:
    url: ${VOTE_DB_URL:jdbc:postgresql://localhost:5432/vote}
    username: ${VOTE_DB_USERNAME:vote}
    password: ${VOTE_DB_PASSWORD:vote}

server:
  port: ${SERVER_PORT:8083}

vote:
  task:
    bootstrap:
      enabled: ${VOTE_TASK_BOOTSTRAP_ENABLED:true}
    lifecycle:
      enabled: ${VOTE_TASK_LIFECYCLE_ENABLED:true}
    prediction:
      enabled: ${VOTE_TASK_PREDICTION_ENABLED:true}
      provider: ${VOTE_TASK_PREDICTION_PROVIDER:fake}
      base-url: ${VOTE_TASK_PREDICTION_BASE_URL:http://localhost:8090}
      path: ${VOTE_TASK_PREDICTION_PATH:/v1/task-predictions}
      auth-token: ${VOTE_TASK_PREDICTION_AUTH_TOKEN:}
      connect-timeout: ${VOTE_TASK_PREDICTION_CONNECT_TIMEOUT:5s}
      request-timeout: ${VOTE_TASK_PREDICTION_REQUEST_TIMEOUT:60s}
      retry-delay: ${VOTE_TASK_PREDICTION_RETRY_DELAY:1s}
      dispatcher-delay: ${VOTE_TASK_PREDICTION_DISPATCHER_DELAY:500ms}
      fake:
        scenario: ${VOTE_TASK_PREDICTION_FAKE_SCENARIO:success}
  survey:
    bootstrap:
      enabled: ${VOTE_SURVEY_BOOTSTRAP_ENABLED:true}
    persona:
      enabled: ${VOTE_SURVEY_PERSONA_ENABLED:true}
      provider: ${VOTE_SURVEY_PERSONA_PROVIDER:fake}
      base-url: ${VOTE_SURVEY_PERSONA_BASE_URL:http://localhost:8090}
      auth-token: ${VOTE_SURVEY_PERSONA_AUTH_TOKEN:}
      dispatcher-delay: ${VOTE_SURVEY_PERSONA_DISPATCHER_DELAY:500ms}
  security:
    local-admin-api-enabled: true
    cookie-authentication-enabled: true
    local-jwt:
      secret: ${VOTE_LOCAL_JWT_SECRET:civic-ai-local-auth-fixture-signing-key-v1-public-do-not-use-in-production}
      issuer: ${VOTE_LOCAL_JWT_ISSUER:http://localhost:3000/api/dev/auth}
      audience: ${VOTE_LOCAL_JWT_AUDIENCE:civic-ai-api}
