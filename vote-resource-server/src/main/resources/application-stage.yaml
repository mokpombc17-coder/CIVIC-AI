server:
  port: ${SERVER_PORT:8082}

civic:
  auth:
    issuer: ${VOTE_JWT_ISSUER_URI:https://140-238-17-223.sslip.io}
    jwks-uri: ${VOTE_JWT_JWKS_URI:https://140-238-17-223.sslip.io/.well-known/jwks.json}
    browser-origin: ${VOTE_BROWSER_ORIGIN:https://140-238-17-223.sslip.io}
    allow-insecure-loopback: false

vote:
  task:
    preparation:
      enabled: ${VOTE_TASK_PREPARATION_ENABLED:false}
      provider: ${VOTE_TASK_PREPARATION_PROVIDER:http}
      base-url: ${VOTE_TASK_PREPARATION_BASE_URL:}
      path: ${VOTE_TASK_PREPARATION_PATH:/v1/tasks/prepare}
      auth-token: ${VOTE_TASK_PREPARATION_AUTH_TOKEN:}
      connect-timeout: ${VOTE_TASK_PREPARATION_CONNECT_TIMEOUT:5s}
      request-timeout: ${VOTE_TASK_PREPARATION_REQUEST_TIMEOUT:30s}
      retry-delay: ${VOTE_TASK_PREPARATION_RETRY_DELAY:30s}
      processing-lease-duration: ${VOTE_TASK_PREPARATION_PROCESSING_LEASE_DURATION:60s}
  security:
    local-admin-api-enabled: ${VOTE_SECURITY_LOCAL_ADMIN_API_ENABLED:false}
