spring:
  datasource:
    url: ${VOTE_TEST_DB_URL:jdbc:postgresql://localhost:5432/vote_test}
    username: ${VOTE_TEST_DB_USERNAME:vote}
    password: ${VOTE_TEST_DB_PASSWORD:vote}

vote:
  integration:
    outbox:
      enabled: false
  persona:
    enabled: false
  task:
    bootstrap:
      enabled: false
    lifecycle:
      enabled: false
    prediction:
      enabled: false
  survey:
    bootstrap:
      enabled: false
